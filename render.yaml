services:
  - type: web
    name: slack-ai-agent
    runtime: node
    plan: free

    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production

      - key: OPENAI_API_KEY
        sync: false

      - key: SLACK_BOT_TOKEN
        sync: false

      - key: SLACK_APP_TOKEN
        sync: false

      - key: SLACK_SIGNING_SECRET
        sync: false

      - key: SLACK_PRIVATE_CHANNEL_ID
        sync: false

      - key: COMPANY_NAME
        sync: false

      - key: COMPANY_PRODUCT
        sync: false

      - key: DATABASE_URL
        sync: false
